[package]
name = "baml-tools-typesafe"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
description = "TypeSafe System One read tool for BAML runtime"

[dependencies]
async-trait = { workspace = true }
baml-derive = { path = "../../baml-derive" }
baml-derive-core = { path = "../../baml-derive-core" }
baml-rt-core = { path = "../../baml-rt-core" }
baml-rt-observability = { path = "../../baml-rt-observability" }
baml-rt-tools = { path = "../../baml-rt-tools" }
inventory = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
baml-rt = { path = "../../baml-rt" }
baml-rt-quickjs = { path = "../../baml-rt-quickjs" }
baml-rt-tools = { path = "../../baml-rt-tools", features = ["test-support"] }
insta = { workspace = true }
test-support = { path = "../../test-support" }
tokio = { workspace = true, features = ["test-util"] }
