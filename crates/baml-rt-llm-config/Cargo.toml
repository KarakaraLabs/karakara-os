[package]
name = "baml-rt-llm-config"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
description = "Centralised LLM client configuration for BAML runtime"

[dependencies]
baml-rt-core = { path = "../baml-rt-core" }
baml-rt-tools = { path = "../baml-rt-tools" }
baml-runtime = { workspace = true }
baml-types = { workspace = true }
internal-llm-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde_yaml = "0.9"
tokio = { workspace = true }
reqwest = { workspace = true }

# The v1.49.0 tag predates fnox's provider feature gates, so pin the feature merge commit until
# the next crates.io release. We only need fnox-core and none of its optional provider families.
[dependencies.fnox]
package = "fnox-core"
version = "1.49.0"
git = "https://github.com/jdx/fnox.git"
rev = "c026bd90b981ee606c79db5829d68bf2dd270b9a"
default-features = false
