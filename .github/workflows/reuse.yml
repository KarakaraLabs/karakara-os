name: License Compliance (REUSE)

# Routine PR verification and main branch license compliance check on standard GitHub-hosted
# ubuntu-latest runners without requiring unprovisioned self-hosted runners or paid API keys.
#
# Key Architectural Properties:
# 1. Standard Compute: Runs on standard GitHub-hosted ubuntu-latest runners (4 vCPU, 16 GB RAM).
# 2. Licensing Compliance: Enforces FSFE REUSE 3.3 standards: every tracked file must carry
#    copyright and license metadata, either via inline SPDX headers or entries in REUSE.toml.
# 3. Fast PR Feedback: Dependency-light action (fsfe/reuse-action@v5) completing in under 20 seconds.
# 4. Concurrency Policy: Protects main branch gate completion while safely cancelling
#    superseded in-flight PR checks upon new commits.

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # required to check out source code and verify SPDX license headers

concurrency:
  group: reuse-${{ github.ref }}
  # Never cancel a check on the default branch — the gate must always complete
  # there. PR re-runs on new commits safely cancel the superseded check.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  reuse:
    name: REUSE 3.3 SPDX Compliance (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run REUSE 3.3 license compliance check
        id: reuse_check
        uses: fsfe/reuse-action@v5

      - name: Generate License Compliance Execution Summary
        if: always()
        run: |
          REUSE_STATUS="${{ steps.reuse_check.outcome }}"

          format_status() {
            case "$1" in
              success) echo "PASSED" ;;
              skipped) echo "SKIPPED" ;;
              *) echo "FAILED" ;;
            esac
          }

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## License Compliance (REUSE) - Execution Summary

          ### Compliance Gates Status
          | Gate | Verification Tool | Status |
          |---|---|---|
          | **SPDX Header Audit** | \`fsfe/reuse-action@v5\` | $(format_status "$REUSE_STATUS") |

          ### Runner & Infrastructure
          | Property | Specification | Details |
          |---|---|---|
          | **Runner Type** | \`ubuntu-latest\` | GitHub-hosted standard pool (\$0 / unlimited minutes) |
          | **Standard** | REUSE Specification 3.3 | Software Package Data Exchange (SPDX) standard |
          | **Licensing Policy** | Apache-2.0 / MIT | Inline headers or \`REUSE.toml\` annotations |
          | **External Secrets** | None (\$0) | Self-contained static file metadata scan |
          EOF
