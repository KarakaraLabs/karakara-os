name: Python Hygiene & Tests

# Lints and tests Python developer tooling under hack/ and scripts/ on standard
# GitHub-hosted ubuntu-latest runners ($0 / unlimited minutes).

on:
  push:
    branches:
      - main
    paths:
      - 'hack/**'
      - 'scripts/**/*.py'
      - '.github/workflows/python-hygiene.yml'
  pull_request:
    paths:
      - 'hack/**'
      - 'scripts/**/*.py'
      - '.github/workflows/python-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-hygiene-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-hygiene:
    name: Python Lint & Unit Tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Lint and format check (ruff)
        run: |
          uv tool run ruff check hack/
          uv tool run ruff format --check hack/

      - name: Run hack/ unit tests (uv + rich)
        run: uv run --with rich python3 -B -m unittest discover -s hack -t . -p 'test_*.py' -v

      - name: Run scripts/ unit tests (unittest)
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
