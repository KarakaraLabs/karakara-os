name: Release Publish (Multi-Arch Binaries)

# Multi-architecture native binary builds and GitHub Release asset publishing.
#
# Key Architectural Properties:
# 1. Native Multi-Arch Architecture: Builds natively on runner of target architecture (no cross):
#    amd64 on ubuntu-22.04 and aarch64 on ubuntu-22.04-arm, providing a consistent glibc 2.35 floor
#    required by statically linked ONNX runtime libraries (fastembed/ort-sys).
# 2. Dynamic Target Matrix: Reads compilation targets dynamically from scripts/release/release-manifest.sh
#    as the single source of truth (SSOT).
# 3. Tag & Workspace Verification: Enforces that release tags strictly match [workspace.package].version
#    in Cargo.toml before initiating heavy matrix builds.
# 4. Tooling PR Smoke Tests: Runs native aarch64 smoke builds on PRs modifying scripts/release/**
#    or the workflow definition itself to catch compilation regressions early.
# 5. Idempotent Asset Publishing: Uses gh release upload with --clobber resilience and aggregates SHA256SUMS.

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    # Only the release tooling — keep the heavy aarch64 build off normal PRs.
    paths:
      - 'scripts/release/**'
      - '.github/workflows/release-publish.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build/upload assets for (for example v0.2.0). Leave empty for dry-run.'
        required: false
        type: string

permissions:
  contents: read  # required to check out repository code for manifest and verify jobs

concurrency:
  group: release-${{ github.ref }}
  # Cancel superseded PR dry-runs; never cancel a tag build mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifest:
    name: Read release manifest targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.read.outputs.targets }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.tag) || github.ref }}

      - name: Extract build targets from release manifest
        id: read
        run: |
          targets=$(bash scripts/release/release-manifest.sh --json \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["targets"]))')
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "release targets: ${targets}"

  verify:
    name: Verify release tag matches workspace version
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code at release reference
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.tag) || github.ref }}

      - name: Verify release tag matches Cargo.toml version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: bash scripts/release/verify-release-tag-matches-workspace-version.sh

  aarch64-dry-run:
    name: Native aarch64 release build smoke test (ubuntu-22.04-arm)
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Update APT package repositories (with retries)
        run: bash scripts/ci/apt-update-retry.sh

      - name: Install system build dependencies (C/C++ toolchain, DBus, LLVM, lld)
        run: |
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libdbus-1-dev libcap-ng-dev \
            clang libclang-dev llvm-dev lld

      - name: Configure LIBCLANG_PATH for bindgen (hirofa-quickjs-sys)
        run: bash scripts/ci/set-libclang-path.sh

      - name: Setup stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build aarch64 release binaries (native)
        run: bash scripts/release/build-release-binaries.sh --target aarch64-unknown-linux-gnu

      - name: Inspect runner binary (architecture and static ONNX linkage)
        run: |
          bin=target/aarch64-unknown-linux-gnu/release-dist/karakara
          file "$bin"
          echo "=== dynamic NEEDED libs ==="
          readelf -d "$bin" | grep NEEDED || true
          file "$bin" | grep -q 'aarch64' \
            || { echo "error: ${bin} is not an aarch64 ELF"; exit 1; }
          if readelf -d "$bin" | grep -qi 'onnxruntime'; then
            echo "error: libonnxruntime is dynamically linked (expected static)"; exit 1
          fi
          echo "aarch64 native build OK: arch correct, ONNX statically linked"

  build:
    name: Build release binaries (${{ matrix.target }})
    needs: [manifest, verify]
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.manifest.outputs.targets) }}
    steps:
      - name: Checkout source code at release reference
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.tag) || github.ref }}

      - name: Update APT package repositories (with retries)
        run: bash scripts/ci/apt-update-retry.sh

      - name: Install system build dependencies (C/C++ toolchain, DBus, LLVM, lld)
        run: |
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libdbus-1-dev libcap-ng-dev \
            clang libclang-dev llvm-dev lld

      - name: Configure LIBCLANG_PATH for bindgen (hirofa-quickjs-sys)
        run: bash scripts/ci/set-libclang-path.sh

      - name: Setup stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries for ${{ matrix.target }}
        run: bash scripts/release/build-release-binaries.sh --target "${{ matrix.target }}"

      - name: Package target distribution tarball
        run: bash scripts/release/pack-target-tarball.sh --target "${{ matrix.target }}"

      - name: Upload target tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball-${{ matrix.target }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release assets to GitHub Releases
    needs: [build]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to upload release tarballs and SHA256SUMS
    steps:
      - name: Download target tarball artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-tarball-*
          path: artifacts
          merge-multiple: true

      - name: Stage distribution assets and calculate SHA256SUMS
        run: |
          mkdir -p out
          find artifacts -name '*.tar.gz' -exec cp {} out/ \;
          ( cd out && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS )

      - name: Publish or update GitHub Release assets (gh release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Idempotent: a re-run after a partial failure reuses the existing
          # release and clobbers its assets instead of erroring on "already exists".
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "release ${TAG_NAME} exists — uploading assets (--clobber)"
            gh release upload "${TAG_NAME}" out/*.tar.gz out/SHA256SUMS --clobber
          else
            gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --generate-notes \
              out/*.tar.gz out/SHA256SUMS
          fi

      - name: Generate Release Publication Summary
        if: always()
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release Publish (Multi-Arch Binaries) - Execution Summary

          ### Published Release Assets
          | Asset File | Size | Verification |
          |---|---|---|
          EOF
          if [ -d "out" ]; then
            ( cd out && for f in *.tar.gz SHA256SUMS; do
                if [ -f "$f" ]; then
                  SIZE=$(ls -lh "$f" | awk '{print $5}')
                  echo "| \`$f\` | $SIZE | Checksum generated |" >> "$GITHUB_STEP_SUMMARY"
                fi
              done )
          fi
          cat << EOF >> "$GITHUB_STEP_SUMMARY"

          ### Runner & Matrix Specifications
          | Target Architecture | Build Runner | Linking Floor |
          |---|---|---|
          | \`x86_64-unknown-linux-gnu\` | \`ubuntu-22.04\` (x86_64) | glibc 2.35 (native) |
          | \`aarch64-unknown-linux-gnu\` | \`ubuntu-22.04-arm\` (aarch64) | glibc 2.35 (native) |
          EOF
