name: Secret Scan (Gitleaks)

# Routine PR verification and main branch security audit on standard GitHub-hosted
# ubuntu-latest runners without requiring unprovisioned self-hosted runners or paid API keys.
#
# Key Architectural Properties:
# 1. Standard Compute: Runs on standard GitHub-hosted ubuntu-latest runners (4 vCPU, 16 GB RAM).
# 2. Credential Protection: Runs full commit history scan (fetch-depth: 0) and working-tree
#    scans against the committed .gitleaks.toml configuration and allowlist rules.
# 3. Zero Cost & Standalone: Completely self-contained security gate requiring zero external
#    tokens or API keys ($0 / unlimited minutes).
# 4. Concurrency & Protection: Protects main branch gate completion while safely cancelling
#    superseded in-flight PR scans upon new commits.

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # required to clone repository and inspect full commit history

concurrency:
  group: secret-scan-${{ github.ref }}
  # Never cancel a scan on the default branch — the gate must always complete
  # there. PR re-runs on new commits safely cancel the superseded scan.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    name: Gitleaks Security Audit (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          # Full history so the history-aware scan inspects every commit, not just the PR tip.
          fetch-depth: 0

      - name: Log runner hardware and OS diagnostics
        run: |
          echo "=== lscpu ==="
          lscpu
          echo "=== nproc ==="
          nproc
          echo "=== system memory ==="
          free -h
          echo "=== uname -a ==="
          uname -a

      - name: Install Gitleaks security scanner (pinned v8.30.1)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan Git commit history (gitleaks git)
        id: git_history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Scan working tree directory (gitleaks dir)
        id: working_tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Generate Security Scan Execution Summary
        if: always()
        run: |
          HISTORY_STATUS="${{ steps.git_history.outcome }}"
          TREE_STATUS="${{ steps.working_tree.outcome }}"

          format_status() {
            case "$1" in
              success) echo "PASSED" ;;
              skipped) echo "SKIPPED" ;;
              *) echo "FAILED" ;;
            esac
          }

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## Secret Scan (Gitleaks) - Execution Summary

          ### Security Gates Status
          | Gate | Scan Target | Status |
          |---|---|---|
          | **Git History Audit** | \`gitleaks git . --config .gitleaks.toml\` | $(format_status "$HISTORY_STATUS") |
          | **Working Tree Audit** | \`gitleaks dir . --config .gitleaks.toml\` | $(format_status "$TREE_STATUS") |

          ### Runner & Infrastructure
          | Property | Specification | Details |
          |---|---|---|
          | **Runner Type** | \`ubuntu-latest\` | GitHub-hosted standard pool (\$0 / unlimited minutes) |
          | **Scanner Version** | Gitleaks \`v8.30.1\` | Standalone binary release (x86_64) |
          | **Configuration** | \`.gitleaks.toml\` | Repository rule sets and path allowlists |
          | **Checkout Depth** | \`fetch-depth: 0\` | Complete commit history audit |
          | **External Secrets** | None (\$0) | Self-contained credential scan |
          EOF
