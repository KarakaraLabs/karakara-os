# Cargo-deny configuration
# See https://embarkstudios.github.io/cargo-deny/

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
# Don't require license field on workspace crates (e.g. baml-agent-runner, baml-compiler from git dep).
[licenses.private]
ignore = true

[sources]
# BAML runtime/compiler from git (contract tests, builder).
allow-git = [
    "https://github.com/BoundaryML/baml",
    "https://github.com/ryan-s-roberts/baml",
]

[advisories]
# Vulnerability exceptions
ignore = []
