# Render via scripts/e2e-k8s/render-argocd-apps.sh — do not kubectl apply raw.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karakara-os
  namespace: argocd
spec:
  project: karakara
  source:
    repoURL: __KARAKARA_GIT_REPO__
    targetRevision: __KARAKARA_GIT_REVISION__
    path: deploy/helm/karakara-os
    helm:
      releaseName: karakara
      valueFiles:
        - ../../values/local/defaults.yaml
        - ../../values/generated/images.yaml
        - ../../values/generated/scenario.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: karakara
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
