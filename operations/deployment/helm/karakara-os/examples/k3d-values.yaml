# Local k3d development values.
#
# Prerequisites: see operations/deployment/helm/karakara-os/README.md
#
# Install:
#   helm upgrade --install karakara operations/deployment/helm/karakara-os/ \
#     --namespace karak --create-namespace \
#     -f operations/deployment/helm/karakara-os/examples/k3d-values.yaml

global:
  environment: development

runner:
  image:
    repository: karakara-runner
    tag: demo
    pullPolicy: Never
  replicaCount: 2
  auth:
    existingSecret: runner-token
  persistence:
    size: 1Gi

surrealdb:
  auth:
    existingSecret: surrealdb-credentials
  persistence:
    size: 1Gi

fnox:
  config:
    existingConfigMap: fnox-config
